<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetGuard — Sign In</title>
  <link rel="stylesheet" href="/static/scanner/style.css">
</head>
<body class="auth-page">
  <div class="auth-shell">
    <section class="auth-hero">
      <div class="auth-brand-card">
        <div class="auth-brand-mark">
          <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="3" width="42" height="42" rx="10" fill="#1B1717"/>
            <path d="M24 8L36 13.5V23.5C36 30.5 30.8 36.8 24 38.5C17.2 36.8 12 30.5 12 23.5V13.5L24 8Z" fill="#810100"/>
            <path d="M20 24.5L23 27.5L29 21.5" stroke="#EDEBDD" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <div class="auth-kicker">NetGuard</div>
        <h1>Sign in to check your network.</h1>
        <p>Find devices and review open ports on your network.</p>
        <div class="auth-feature-list">
          <div class="auth-feature-pill">Device scan</div>
          <div class="auth-feature-pill">Port checks</div>
          <div class="auth-feature-pill">Scan history</div>
        </div>
      </div>
    </section>

    <section class="auth-panel-wrap">
      <div class="auth-panel">
        <div class="auth-panel-header">
          <div class="panel-eyebrow">Welcome back</div>
          <h2 class="auth-title">Sign in to NetGuard</h2>
          <p class="auth-subtitle">Enter your username and password.</p>
        </div>

        {% if error %}
        <div class="auth-alert auth-alert-error">{{ error }}</div>
        {% endif %}

        <form method="post" class="auth-form">
          {% csrf_token %}
          <div class="auth-field">
            <label for="username">Username</label>
            <input id="username" type="text" name="username" placeholder="Enter your username" required autofocus>
          </div>

          <div class="auth-field">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" placeholder="Enter your password" required>
          </div>

          <button type="submit" class="btn btn-primary auth-submit">Sign In</button>
        </form>

        <div class="auth-footer">
          <span>New to NetGuard?</span>
          <a href="{% url 'register' %}" class="auth-link-pill">Create account</a>
        </div>
      </div>
    </section>
  </div>
</body>
</html>
